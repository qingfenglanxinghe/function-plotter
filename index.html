<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="一个只做函数图像与图像分析的在线画板：零点、极值、交点、导函数、切线。零依赖，单文件。">
<title>函数画板 · Function Plotter</title>
<style>
/* ============================================================
   主题变量
   ============================================================ */
:root{
	--bg:#eef1f6;
	--surface:#ffffff;
	--surface2:#f7f9fc;
	--canvas:#ffffff;
	--line:#dde3ec;
	--line2:#edf1f7;
	--text:#1f2733;
	--muted:#6b7787;
	--faint:#9aa7b8;
	--accent:#2563eb;
	--accent2:#e8f0ff;
	--accent-hover:#1d4ed8;
	--switch-off:#cdd6e2;
	--edge:#c3d7ff;
	--hover:#e9eef7;
	--danger:#dc2626;
	--grid-minor:#f4f7fc;
	--grid-major:#e8eef7;
	--axis:#9aa7b8;
	--r:8px;
	--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
	--shadow-sm:0 1px 2px rgba(16,24,40,.07),0 2px 6px rgba(16,24,40,.05);
	--shadow-lg:0 10px 40px rgba(16,24,40,.20);
	--scroll:#cfd7e2;
	--c1:#2563eb; --c2:#dc2626; --c3:#059669; --c4:#d97706;
	--c5:#7c3aed; --c6:#0891b2; --c7:#db2777; --c8:#65a30d;
}
html[data-theme="dark"]{
	--bg:#0f1319;
	--surface:#161b22;
	--surface2:#1b222b;
	--canvas:#161b22;
	--line:#2a323d;
	--line2:#212832;
	--text:#e6eaf0;
	--muted:#8b96a5;
	--faint:#6b7787;
	--accent:#3b82f6;
	--accent2:#1a2b45;
	--accent-hover:#60a5fa;
	--switch-off:#39424f;
	--edge:#2f4a72;
	--hover:#1e2732;
	--danger:#f87171;
	--grid-minor:#1a212a;
	--grid-major:#222b36;
	--axis:#4a5563;
	--shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.35);
	--shadow-sm:0 1px 2px rgba(0,0,0,.45);
	--shadow-lg:0 10px 40px rgba(0,0,0,.6);
	--scroll:#39424f;
	--c1:#60a5fa; --c2:#f87171; --c3:#34d399; --c4:#fbbf24;
	--c5:#a78bfa; --c6:#22d3ee; --c7:#f472b6; --c8:#a3e635;
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
	font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
	font-size:13px;line-height:1.55;
	background:var(--bg);
	color:var(--text);
	-webkit-font-smoothing:antialiased;
	-webkit-user-select:none;user-select:none;
	overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit;outline:none}
button{
	cursor:pointer;background:var(--surface);border:1px solid var(--line);
	border-radius:6px;padding:5px 10px;
	transition:background .13s,border-color .13s,color .13s;
	white-space:nowrap;touch-action:manipulation;
}
button:hover{background:var(--accent2);border-color:var(--edge)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text]{
	width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;
	background:var(--surface);transition:border-color .13s,box-shadow .13s;
	-webkit-user-select:text;user-select:text;
}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.10)}

/* ============================================================
	布局
   ============================================================ */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

.topbar{
	height:48px;flex:0 0 48px;
	display:flex;align-items:center;gap:8px;
	padding:0 12px;
	background:var(--surface);
	border-bottom:1px solid var(--line);
	z-index:20;
}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.brand .dot{
	width:14px;height:14px;border-radius:4px;flex:0 0 auto;
	background:linear-gradient(135deg,#2563eb,#7c3aed);
	box-shadow:0 1px 3px rgba(37,99,235,.35);
}
.brand .sub{
	font-weight:400;font-size:10px;color:var(--faint);
	letter-spacing:.08em;text-transform:uppercase;margin-left:2px;
}
.topbar .spacer{flex:1;min-width:0}
.tbtn{
	height:32px;padding:0 11px;
	display:inline-flex;align-items:center;gap:6px;
	color:var(--muted);
}
.tbtn:hover{color:var(--accent)}
.tbtn.primary{
	background:var(--accent);border-color:var(--accent);
	color:#fff;font-weight:500;
}
.tbtn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}

/* 语言切换 */
.lang-wrap{position:relative;flex:0 0 auto}
.lang-menu{
	position:absolute;right:0;top:calc(100% + 6px);
	min-width:136px;padding:5px;
	border:1px solid var(--line);border-radius:8px;
	background:var(--surface);box-shadow:var(--shadow-lg);
	display:none;flex-direction:column;gap:1px;z-index:50;
}
.lang-menu.open{display:flex}
.lang-menu button{
	display:block;width:100%;text-align:left;
	padding:6px 9px;border:0;background:transparent;
	border-radius:6px;font-size:12.5px;color:var(--muted);
}
.lang-menu button:hover{background:var(--hover);color:var(--text)}
.lang-menu button.on{color:var(--accent);font-weight:600}

.main{flex:1;display:flex;min-height:0}

/* ============================================================
	侧栏
   ============================================================ */
.sidebar{
	width:314px;flex:0 0 314px;
	display:flex;flex-direction:column;gap:0;
	background:var(--surface);
	border-right:1px solid var(--line);
	overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
	z-index:10;
}
.sidebar::-webkit-scrollbar{width:9px}
.sidebar::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:9px;border:2px solid var(--surface)}
.sidebar::-webkit-scrollbar-track{background:transparent}

.sec{padding:12px 12px 14px;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:0}
.sec-h{
	display:flex;align-items:center;justify-content:space-between;
	gap:8px;margin-bottom:9px;
}
.sec-h .ttl{font-size:13px;font-weight:600;color:var(--text);margin-right:auto}
.sec-h .hint{font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}
.sec-h .add{
	display:grid;place-items:center;
	width:24px;height:24px;padding:0;
	border:0;background:transparent;
	border-radius:6px;font-size:15px;line-height:1;
	color:var(--muted);
}
.sec-h .add:hover{color:var(--accent)}
.sec-h .add:disabled{opacity:.35;cursor:not-allowed}

/* ---- 曲线条目 ---- */
.curve{
	display:flex;align-items:center;gap:6px;
	padding:3px 0;
}
.swatch{
	flex:0 0 9px;width:9px;height:9px;border-radius:50%;
	cursor:pointer;
	box-shadow:0 0 0 3px color-mix(in srgb,currentColor 12%,transparent);
}
.curve .wrap{position:relative;flex:1;min-width:0}
.curve input{
	width:100%;height:30px;padding:0 8px;
	border:1px solid var(--line);border-radius:6px;
	background:var(--surface);
	font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
	font-size:12px;letter-spacing:.01em;
	transition:border-color .13s,box-shadow .13s;
}
.curve input:focus{
	outline:none;border-color:var(--accent);background:var(--surface);
	box-shadow:0 0 0 3px rgba(37,99,235,.10);
}
.curve.bad input{border-color:var(--danger);color:var(--danger)}
.curve.off .swatch{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--faint)}
.curve.off input{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.iconbtn{
	display:grid;place-items:center;
	flex:0 0 26px;width:26px;height:26px;padding:0;
	border:0;background:transparent;
	border-radius:6px;color:var(--muted);font-size:12px;
	transition:background .13s,color .13s;
}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn.del:hover{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.iconbtn:disabled{opacity:.3;cursor:not-allowed}

.curve-err{
	margin:2px 0 4px 15px;
	font-size:11px;color:var(--danger);
	font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
	word-break:break-word;line-height:1.5;
}

/* ---- 分析开关：iOS 风格滑块，与商业版一致 ---- */
.an-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px 4px;margin:0 -2px}
.check{
	display:flex;align-items:center;gap:8px;
	padding:4px 2px;border-radius:6px;cursor:pointer;
	font-size:12.5px;color:var(--muted);
	-webkit-user-select:none;user-select:none;
	transition:color .13s;
}
.check:hover{color:var(--text)}
.check input{
	-webkit-appearance:none;-moz-appearance:none;appearance:none;
	width:38px;height:22px;border-radius:11px;
	flex:0 0 auto;margin:0;padding:0;border:0;
	position:relative;cursor:pointer;
	background:var(--switch-off);
	transition:background .22s ease;
	vertical-align:middle;
}
.check input::after{
	content:'';position:absolute;top:2px;left:2px;
	width:18px;height:18px;border-radius:50%;
	background:#fff;
	box-shadow:0 1px 2px rgba(0,0,0,.20),0 2px 6px rgba(0,0,0,.14);
	transition:transform .24s cubic-bezier(.32,1.35,.5,1);
}
/* 同时用 :checked 与 .on：「外观重置」过的 checkbox 在部分 WebKit 版本里
   不会因属性变化重算 :checked 的样式（实测 matches 为真但背景不变），
   由 JS 同步一个 .on 类作为可靠通道。 */
.check input:checked,
.check input.on{background:var(--accent)}
.check input:checked::after,
.check input.on::after{transform:translateX(16px)}
.check input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check input:disabled{opacity:.42;cursor:not-allowed}
.check.off{opacity:.45;cursor:not-allowed}
.check.off input{cursor:not-allowed}

.tanrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.tanrow label{flex:0 0 auto;white-space:nowrap;font-size:12.5px;color:var(--muted)}
.tanrow input{
	flex:1;min-width:0;height:30px;
	border:1px solid var(--line);border-radius:6px;background:var(--surface);
	font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
	transition:border-color .13s,box-shadow .13s;
}
.tanrow input:focus{
	outline:none;border-color:var(--accent);
	box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

/* ---- 分析结果读数 ---- */
.readout{
	margin-top:12px;padding:9px 10px;
	border:1px solid var(--line2);border-radius:8px;
	background:var(--surface2);
	font-size:11.5px;line-height:1.75;color:var(--muted);
	font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
	max-height:178px;overflow-y:auto;
	display:none;
}
.readout.show{display:block}
.readout b{color:var(--text);font-weight:600}
.readout .k{color:var(--faint)}

/* ============================================================
	画布区
   ============================================================ */
.stage{position:relative;flex:1;min-width:0;background:var(--canvas);overflow:hidden}
#board{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#board.panning{cursor:grabbing}

/* 空状态：没有任何可见曲线时的引导，避免用户面对空画布 */
.empty{
	position:absolute;inset:0;
	display:none;align-items:center;justify-content:center;
	padding:0 24px;
	pointer-events:none;
}
.empty.show{display:flex}
.empty .em-box{
	display:flex;flex-direction:column;align-items:center;gap:7px;
	padding:18px 24px;border-radius:10px;
	background:color-mix(in srgb,var(--surface) 94%,transparent);
	border:1px solid var(--line);
	box-shadow:var(--shadow);
	-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
	text-align:center;max-width:420px;
}
.empty .em-t{font-size:14px;font-weight:600;color:var(--text)}
.empty .em-s{font-size:12.5px;color:var(--muted);line-height:1.95}
.empty code{
	font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
	font-size:12px;color:var(--accent);
	background:var(--accent2);border:1px solid var(--edge);
	padding:1px 5px;border-radius:4px;
}

/* 坐标读数：深色胶囊，与商业版底部提示条同一套语言 */
.hud{
	position:absolute;left:14px;bottom:14px;
	padding:7px 13px;border-radius:18px;
	background:rgba(31,39,51,.90);
	color:#fff;
	-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
	font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
	font-size:11.5px;letter-spacing:.01em;
	pointer-events:none;white-space:nowrap;
	box-shadow:0 4px 14px rgba(16,24,40,.18);
	opacity:0;transform:translateY(4px);
	transition:opacity .16s,transform .16s;
}
.hud.show{opacity:1;transform:none}
html[data-theme="dark"] .hud{background:rgba(230,234,240,.94);color:#1f2733}

.legend{
	position:absolute;right:14px;top:14px;
	display:flex;flex-direction:column;gap:6px;
	padding:9px 11px;border-radius:8px;
	background:color-mix(in srgb,var(--surface) 92%,transparent);
	border:1px solid var(--line);
	-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
	font-size:11.5px;color:var(--muted);
	box-shadow:var(--shadow-sm);pointer-events:none;
	max-width:250px;
}
.legend .li{display:flex;align-items:center;gap:7px}
.legend .li .bar{width:12px;height:2.5px;border-radius:2px;flex:0 0 12px}
.legend .li .nm{
	font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
	overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.legend.hide{display:none}

.stage-tools{
	position:absolute;right:14px;bottom:14px;
	display:flex;flex-direction:column;gap:6px;
}
.fbtn{
	display:grid;place-items:center;
	width:36px;height:36px;padding:0;
	border-radius:8px;
	border:1px solid var(--line);
	background:color-mix(in srgb,var(--surface) 94%,transparent);
	-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
	color:var(--muted);font-size:15px;
	box-shadow:var(--shadow-sm);
	transition:background .13s,color .13s,border-color .13s;
}
.fbtn:hover{background:var(--surface);color:var(--accent);border-color:var(--edge)}

/* ============================================================
	窄屏
   ============================================================ */
@media (max-width:760px){
	.main{flex-direction:column}
	.sidebar{
		width:auto;flex:0 0 auto;
		flex-direction:row;
		border-right:0;border-bottom:1px solid var(--line);
		overflow-x:auto;overflow-y:hidden;
		-webkit-overflow-scrolling:touch;
	}
	/* 两块按比例分屏，保证一屏内完整可见，不依赖横向滑动 */
	.sec{border-bottom:0;border-right:1px solid var(--line2);padding:10px 11px 11px;min-width:0}
	.sec.curves-sec{flex:0 0 42%}
	.sec.analysis-sec{flex:1 1 auto}
	.sec-h{margin-bottom:7px}
	.sec-h .ttl{font-size:12.5px}
	.sec-h .hint{display:none}
	.an-grid{grid-template-columns:1fr 1fr;gap:0 2px;margin:0}
	.check{padding:2px 0;font-size:11.5px;gap:5px}
	.check input{width:32px;height:19px}
	.check input::after{width:15px;height:15px}
	.check input:checked::after,
	.check input.on::after{transform:translateX(13px)}
	.tanrow{margin-top:6px;gap:6px}
	.tanrow label{flex:0 0 46px;font-size:12px}
	.tanrow input{height:28px;font-size:12px}
	.readout{display:none!important}
	.legend{max-width:150px;font-size:11px;right:10px;top:10px}
	.topbar{padding:0 10px;gap:6px}
	/* 窄屏下品牌文字会让顶栏按钮贴边，只保留 logo */
	.brand .name{display:none}
	.brand .sub{display:none}
	.tbtn{padding:0 8px;font-size:12px}
	.lang-menu{min-width:124px}
}
@media (max-width:420px){
	.hud{font-size:11px;left:10px;bottom:10px}
	.stage-tools{right:10px;bottom:10px}
	.fbtn{width:34px;height:34px}
}
</style>
</head>
<body>
<div class="app">
	<header class="topbar">
		<div class="brand">
			<span class="dot"></span><span class="name" data-i18n="appName">Function Plotter</span><span class="sub" data-i18n="appSub"></span>
		</div>
		<div class="spacer"></div>
		<div class="lang-wrap">
			<button class="tbtn" id="btnLang" title="Language">EN</button>
			<div class="lang-menu" id="langMenu">
				<button data-lang="en">English</button>
				<button data-lang="zhHans">简体中文</button>
				<button data-lang="zhHant">繁體中文</button>
			</div>
		</div>
		<button class="tbtn" id="btnTheme" data-i18n="themeDark" data-i18n-title="themeToggle">Dark</button>
		<button class="tbtn" id="btnFit" data-i18n="fit" data-i18n-title="fitTitle">Fit</button>
		<button class="tbtn primary" id="btnPng" data-i18n="export" data-i18n-title="exportTitle">Export</button>
	</header>
	<main class="main">
		<aside class="sidebar">
			<section class="sec curves-sec">
				<div class="sec-h">
					<span class="ttl" data-i18n="secFunctions">Functions</span>
					<span class="hint" data-i18n="hintEnter">Press Enter</span>
					<button class="add" id="btnAdd" data-i18n-title="addCurve">+</button>
				</div>
				<div id="curveList"></div>
			</section>
			<section class="sec analysis-sec">
				<div class="sec-h">
					<span class="ttl" data-i18n="secAnalysis">Graph analysis</span>
					<span class="hint" data-i18n="hintLive">Live</span>
				</div>
				<div class="an-grid">
					<label class="check"><input type="checkbox" id="anRoots"><span data-i18n="anRoots">Roots</span></label>
					<label class="check"><input type="checkbox" id="anExtrema"><span data-i18n="anExtrema">Extrema</span></label>
					<label class="check"><input type="checkbox" id="anCross"><span data-i18n="anCross">Crossings</span></label>
					<label class="check"><input type="checkbox" id="anDeriv"><span data-i18n="anDeriv">Derivative</span></label>
				</div>
				<div class="tanrow">
					<label for="anTan" data-i18n="tanLabel">Tangent</label>
					<input type="text" id="anTan" data-i18n-ph="tanPlaceholder" placeholder="x₀, empty to hide" spellcheck="false">
				</div>
				<div class="readout" id="readout"></div>
			</section>
		</aside>
		<div class="stage" id="stage">
			<canvas id="board"></canvas>
			<div class="empty" id="empty">
				<div class="em-box">
					<div class="em-t" data-i18n="emptyTitle">No functions yet</div>
					<div class="em-s"><span data-i18n="emptyBody">Enter an expression to start, e.g.</span> <code>sin(x)</code> <code>x^2/4-1</code> <code>1/x</code></div>
				</div>
			</div>
			<div class="legend hide" id="legend"></div>
			<div class="hud" id="hud"></div>
			<div class="stage-tools">
				<button class="fbtn" id="btnIn" data-i18n-title="zoomIn">+</button>
				<button class="fbtn" id="btnOut" data-i18n-title="zoomOut">−</button>
				<button class="fbtn" id="btnReset" data-i18n-title="resetView">⌂</button>
			</div>
		</div>
	</main>
</div>

<script>
"use strict";
/* ============================================================================
   函数画板 Function Plotter
   一个只做「函数图像 + 图像分析」的画板。零依赖，单文件，可直接静态托管。
   模块顺序：表达式引擎 → 视口 → 采样 → 数值分析 → 渲染 → 状态
   ========================================================================== */

/* ============================================================
   0. 界面语言
   默认跟随系统语言，无法判定时用英文。选择结果持久化。
   引擎抛出的错误同样走这里的字典，避免英文界面里出现中文报错。
   ============================================================ */

const LANGS = ["en", "zhHans", "zhHant"];
const LANG_TAG = { en: "EN", zhHans: "简", zhHant: "繁" };
const LANG_KEY = "fp.lang";

const I18N = {
	en: {
		appName: "Function Plotter",
		appSub: "",
		themeDark: "Dark",
		themeLight: "Light",
		themeToggle: "Toggle light / dark theme",
		fit: "Fit",
		fitTitle: "Fit view to curves (F)",
		export: "Export",
		exportTitle: "Export as PNG",
		secFunctions: "Functions",

let LANG = "en";

/** 安全存储：file:// 与隐私模式下 localStorage 可能抛异常 */
const Store = {
	get(k) {
		try { return localStorage.getItem(k); } catch (e) { return null; }
	},
	set(k, v) {
		try { localStorage.setItem(k, v); } catch (e) { void e; }
	}
};

function t(key, vars) {
	const table = I18N[LANG] || I18N.en;
	let s = table[key];
	if (s === undefined) s = I18N.en[key];
	if (s === undefined) s = key;
	if (vars) {
		s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? String(vars[k]) : m));
	}
	return s;
}

function detectLang() {
	const saved = Store.get(LANG_KEY);
	if (saved && LANGS.indexOf(saved) >= 0) return saved;
	const nav = String(navigator.language || "en").toLowerCase();
	if (nav.indexOf("zh") === 0) {
		return /hant|tw|hk|mo/.test(nav) ? "zhHant" : "zhHans";
	}
	return "en";
}

/** 应用语言到静态文案与动态内容 */
function applyLang(lang, persist) {
	LANG = LANGS.indexOf(lang) >= 0 ? lang : "en";
	document.documentElement.lang =
		LANG === "zhHans" ? "zh-CN" : (LANG === "zhHant" ? "zh-TW" : "en");

	document.querySelectorAll("[data-i18n]").forEach(el => {
		el.textContent = t(el.getAttribute("data-i18n"));
	});
	document.querySelectorAll("[data-i18n-title]").forEach(el => {
		el.title = t(el.getAttribute("data-i18n-title"));
	});
	document.querySelectorAll("[data-i18n-ph]").forEach(el => {
		el.placeholder = t(el.getAttribute("data-i18n-ph"));
	});

	const btn = document.getElementById("btnLang");
	if (btn) btn.textContent = LANG_TAG[LANG];

	document.querySelectorAll("#langMenu button").forEach(b => {
		b.classList.toggle("on", b.getAttribute("data-lang") === LANG);
	});

	updateThemeLabel();
	document.title = t("appName");

	/* 依赖语言的动态内容需要重建 */
	if (App && App.curves && App.curves.length >= 0 && App.renderer) {
		renderCurveList();
		if (App.readout) renderReadout(App.readout);
		scheduleDraw();
	}

	if (persist) Store.set(LANG_KEY, LANG);
}

/* ============================================================
   1. 数学常量与函数
   ============================================================ */
const CONSTS = {
	pi: Math.PI,
	tau: Math.PI * 2,
	e: Math.E
};

const FUNCS = {
	sin: Math.sin, cos: Math.cos, tan: Math.tan,
	asin: Math.asin, acos: Math.acos, atan: Math.atan, atan2: Math.atan2,
	sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
	sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs,
	ln: Math.log, log: Math.log10, log2: Math.log2, exp: Math.exp,
	floor: Math.floor, ceil: Math.ceil, round: Math.round,
	trunc: Math.trunc, sign: Math.sign, fract: x => x - Math.floor(x),
	pow: Math.pow, mod: (a, b) => ((a % b) + b) % b,
	min: Math.min, max: Math.max,
	step: x => (x >= 0 ? 1 : 0),
	sgn: (x, p) => Math.sign(x) * Math.pow(Math.abs(x), p === undefined ? 1 : p)
};

/* 最长匹配优先：func 或 const 名单，按长度降序 */
const NAMES = Object.keys(FUNCS).concat(Object.keys(CONSTS))
	.sort((a, b) => b.length - a.length || (a < b ? -1 : 1));

/* ============================================================
   2. 表达式引擎
   词法 → 语法 → 编译为闭包。编译后调用开销接近原生函数。
   ============================================================ */

const Expr = (() => {

	/** 抛出带错误码的异常，文案由 UI 层按当前语言翻译 */
	function fail(code, params) {
		const e = new Error(code);
		e.code = code;
		e.params = params || {};
		return e;
	}

	/** 归一化：全角/数学符号 → ASCII，使公式可以直接粘贴 */
	function normalize(src) {
		return String(src)
			.replace(/[\uFF08]/g, "(").replace(/[\uFF09]/g, ")")
			.replace(/[\uFF0C]/g, ",").replace(/[\uFF0B]/g, "+")
			.replace(/[\u2212\u2013\u2014\uFF0D]/g, "-")
			.replace(/[\u00D7\u00B7\u22C5\uFF0A]/g, "*")
			.replace(/[\u00F7\uFF0F]/g, "/")
			.replace(/\u03C0/g, "pi").replace(/\u03C4/g, "tau")
			.replace(/\u00B2/g, "^2").replace(/\u00B3/g, "^3")
			.replace(/\u221A/g, "sqrt")
			.replace(/[\u200B-\u200D\uFEFF]/g, "");
	}

	const isDigit = c => c >= "0" && c <= "9";
	const isAlpha = c => /[A-Za-z]/.test(c);

	function tokenize(src) {
		const s = normalize(src);
		const out = [];
		let i = 0;

		while (i < s.length) {
			const c = s[i];

			if (c === " " || c === "\t" || c === "\n" || c === "\r") { i++; continue; }

			/* 数字（含小数与科学计数） */
			if (isDigit(c) || (c === "." && isDigit(s[i + 1]))) {
				let j = i, dot = false;
				while (j < s.length && (isDigit(s[j]) || (!dot && s[j] === "."))) {
					if (s[j] === ".") dot = true;
					j++;
				}
				if (s[j] === "e" || s[j] === "E") {
					const n1 = s[j + 1], n2 = s[j + 2];
					if (isDigit(n1) || ((n1 === "+" || n1 === "-") && isDigit(n2))) {
						j += 2;
						while (j < s.length && isDigit(s[j])) j++;
					}
				}
				out.push({ t: "num", v: parseFloat(s.slice(i, j)) });
				i = j; continue;
			}

			/* 标识符：先试最长匹配已知函数/常量，否则取单字母变量 */
			if (isAlpha(c)) {
				let hit = null;
				for (let k = 0; k < NAMES.length; k++) {
					const nm = NAMES[k];
					if (s.startsWith(nm, i)) { hit = nm; break; }
				}
				if (hit) {
					if (Object.prototype.hasOwnProperty.call(CONSTS, hit)) {
						out.push({ t: "const", v: hit });
					} else {
						out.push({ t: "func", v: hit });
					}
					i += hit.length;
				} else {
					out.push({ t: "var", v: c });
					i++;
				}
				continue;
			}

			if ("+-*/^(),".indexOf(c) >= 0) { out.push({ t: c }); i++; continue; }

			throw fail("errBadChar", { ch: c });
		}

		/* 隐式乘法：(x+1)(x-1)  2x  3sin(x)  x(x+2) */
		const merged = [];
		for (let k = 0; k < out.length; k++) {
			const prev = out[k - 1], cur = out[k];
			if (prev) {
				const ends = prev.t === "num" || prev.t === "var" || prev.t === "const" || prev.t === ")";
				const starts = cur.t === "num" || cur.t === "var" || cur.t === "const"
					|| cur.t === "func" || cur.t === "(";
				if (ends && starts) merged.push({ t: "*" });
			}
			merged.push(cur);
		}
		return merged;
	}

	function parse(tokens) {
		let i = 0;
		const peek = () => tokens[i];
		const eat = t => { if (tokens[i] && tokens[i].t === t) { i++; return true; } return false; };

		function addsub() {
			let l = muldiv();
			while (peek() && (peek().t === "+" || peek().t === "-")) {
				const op = tokens[i++].t;
				l = { type: "bin", op, a: l, b: muldiv() };
			}
			return l;
		}
		function muldiv() {
			let l = unary();
			while (peek() && (peek().t === "*" || peek().t === "/")) {
				const op = tokens[i++].t;
				l = { type: "bin", op, a: l, b: unary() };
			}
			return l;
		}
		/* 一元负号绑定弱于乘方：-x^2 读作 -(x^2) */
		function unary() {
			if (peek() && (peek().t === "-" || peek().t === "+")) {
				const op = tokens[i++].t;
				const a = unary();
				return op === "-" ? { type: "neg", a } : a;
			}
			return power();
		}
		function power() {
			const base = atom();
			if (peek() && peek().t === "^") {
				i++;
				return { type: "bin", op: "^", a: base, b: unary() };  /* 右结合 */
			}
			return base;
		}
		function atom() {
			const tk = peek();
			if (!tk) throw fail("errIncomplete");

			if (tk.t === "num") { i++; return { type: "num", v: tk.v }; }
			if (tk.t === "const") { i++; return { type: "num", v: CONSTS[tk.v] }; }
			if (tk.t === "var") {
				i++;
				if (tk.v !== "x") throw fail("errUnknownVar", { v: tk.v });
				return { type: "var" };
			}
			if (tk.t === "func") {
				const nm = tokens[i++].v;
				if (!eat("(")) throw fail("errNeedParen", { fn: nm });
				const args = [addsub()];
				while (eat(",")) args.push(addsub());
				if (!eat(")")) throw fail("errMissingParen");
				return { type: "call", name: nm, args };
			}
			if (tk.t === "(") {
				i++;
				const e = addsub();
				if (!eat(")")) throw fail("errMissingParen");
				return e;
			}
			throw fail("errUnexpected", { tok: tk.t });
		}

		const ast = addsub();
		if (i < tokens.length) throw fail("errTrailing", { tok: tokens[i].t });
		return ast;
	}

	function compile(ast) {
		switch (ast.type) {
			case "num": { const v = ast.v; return () => v; }
			case "var": return x => x;
			case "neg": { const a = compile(ast.a); return x => -a(x); }
			case "bin": {
				const a = compile(ast.a), b = compile(ast.b);
				switch (ast.op) {
					case "+": return x => a(x) + b(x);
					case "-": return x => a(x) - b(x);
					case "*": return x => a(x) * b(x);
					case "/": return x => a(x) / b(x);
					case "^": return x => Math.pow(a(x), b(x));
				}
				break;
			}
			case "call": {
				const f = FUNCS[ast.name];
				if (!f) throw fail("errUnknownFunc", { fn: ast.name });
				const A = ast.args.map(compile);
				if (A.length === 1) { const a = A[0]; return x => f(a(x)); }
				if (A.length === 2) { const a = A[0], b = A[1]; return x => f(a(x), b(x)); }
				if (A.length === 3) { const a = A[0], b = A[1], c = A[2]; return x => f(a(x), b(x), c(x)); }
				throw fail("errTooManyArgs");
			}
		}
		throw fail("errInternal");
	}

	/** 编译表达式字符串为 (x) => number */
	function parseToFn(src) {
		const text = String(src == null ? "" : src).trim();
		if (!text) throw fail("errEmpty");
		return compile(parse(tokenize(text)));
	}

	return { parseToFn, tokenize, parse, normalize };
})();

/* ============================================================
   3. 视口：世界坐标 ↔ 屏幕坐标
   ============================================================ */
class Viewport {
	constructor() {
		this.cx = 0;      /* 视图中心（世界坐标） */
		this.cy = 0;
		this.kx = 60;     /* 每世界单位对应的像素数 */
		this.ky = 60;
		this.W = 800;     /* 画布逻辑尺寸（CSS 像素） */
		this.H = 600;
	}
	toSx(wx) { return this.W / 2 + (wx - this.cx) * this.kx; }
	toSy(wy) { return this.H / 2 - (wy - this.cy) * this.ky; }
	toWx(sx) { return this.cx + (sx - this.W / 2) / this.kx; }
	toWy(sy) { return this.cy - (sy - this.H / 2) / this.ky; }

	/** 以屏幕点 (sx,sy) 为不动点缩放 */
	zoomAt(sx, sy, factor) {
		const wx = this.toWx(sx), wy = this.toWy(sy);
		this.kx = clamp(this.kx * factor, 1e-4, 1e7);
		this.ky = clamp(this.ky * factor, 1e-4, 1e7);
		this.cx = wx - (sx - this.W / 2) / this.kx;
		this.cy = wy + (sy - this.H / 2) / this.ky;
	}
	panBy(dxPx, dyPx) {
		this.cx -= dxPx / this.kx;
		this.cy += dyPx / this.ky;
	}
}

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

/* ============================================================
   4. 采样：自适应密度 + 断点识别
   ============================================================ */
function safeEval(fn, x) {
	try {
		const y = fn(x);
		return Number.isFinite(y) ? y : null;
	} catch (e) {
		return null;
	}
}

/**
 * 把函数在当前视口内采样成若干屏幕空间折线。
 * 关键点：跨越渐近线（1/x、tan x）时必须断开，否则会画出竖直线。
 */
function samplePath(fn, vp) {
	const segs = [];
	let cur = [];
	const xa = vp.toWx(0), xb = vp.toWx(vp.W);
	const N = Math.min(3000, Math.max(500, Math.round(vp.W / 1.4)));
	const yCap = vp.H * 6;           /* 超出太多直接丢弃，省得画巨型线段 */
	const maxJump = vp.H * 1.1;

	let prevSx = 0, prevSy = null;

	const flush = () => { if (cur.length > 1) segs.push(cur); cur = []; };

	for (let k = 0; k <= N; k++) {
		const x = xa + (xb - xa) * k / N;
		const y = safeEval(fn, x);
		const sx = vp.toSx(x);

		if (y === null) { flush(); prevSy = null; prevSx = sx; continue; }

		const sy = vp.toSy(y);
		if (!Number.isFinite(sy) || Math.abs(sy) > yCap) {
			flush(); prevSy = null; prevSx = sx; continue;
		}

		if (prevSy !== null && Math.abs(sy - prevSy) > maxJump) {
			/* 大跳变：判断是陡峭连续段还是渐近线 */
			const xm = vp.toWx((prevSx + sx) / 2);
			const ymv = safeEval(fn, xm);
			const lo = Math.min(prevSy, sy), hi = Math.max(prevSy, sy);
			let isAsymptote = false;
			if (ymv === null) {
				isAsymptote = true;
			} else {
				const ym = vp.toSy(ymv);
				const span = hi - lo;
				isAsymptote = !(ym >= lo - span * 0.25 && ym <= hi + span * 0.25);
			}
			if (isAsymptote) { flush(); prevSy = null; }
		}

		cur.push([sx, sy]);
		prevSx = sx;
		prevSy = sy;
	}
	flush();
	return segs;
}

/* ============================================================
   5. 数值分析：零点 / 极值 / 交点 / 导数
   ============================================================ */
const Numeric = (() => {

	/** 二分求根。渐近线导致的假变号会被末尾的函数值检查排除。 */
	function bisect(fn, lo, hi, flo) {
		for (let k = 0; k < 64; k++) {
			const mid = (lo + hi) / 2;
			const fm = safeEval(fn, mid);
			if (fm === null) return null;
			if (fm === 0) return mid;
			if (flo * fm < 0) { hi = mid; }
			else { lo = mid; flo = fm; }
		}
		const r = (lo + hi) / 2;
		const fr = safeEval(fn, r);
		if (fr === null) return null;
		if (Math.abs(fr) > 1e6) return null;   /* 1/x 在 0 附近：值爆炸 → 不是零点 */
		return r;
	}

	/** 在 [a,b] 内扫描求所有零点 */
	function roots(fn, a, b, samples) {
		const n = samples || 1600;
		const step = (b - a) / n;
		const res = [];
		let xp = a, fp = safeEval(fn, a);

		for (let k = 1; k <= n; k++) {
			const x = a + step * k;
			const fx = safeEval(fn, x);
			if (fp !== null && fx !== null) {
				if (fp === 0) res.push(xp);
				else if (fp * fx < 0) {
					const r = bisect(fn, xp, x, fp);
					if (r !== null) res.push(r);
				}
			}
			xp = x; fp = fx;
		}
		return dedupe(res, Math.abs(step) * 2.5);
	}

	/** 黄金分割求局部极值 */
	function golden(fn, a, b, maximize) {
		const R = (Math.sqrt(5) - 1) / 2;
		let c = b - R * (b - a), d = a + R * (b - a);
		let fc = safeEval(fn, c), fd = safeEval(fn, d);
		for (let k = 0; k < 64 && b - a > 1e-12; k++) {
			if (fc === null || fd === null) break;
			const betterLeft = maximize ? fc > fd : fc < fd;
			if (betterLeft) { b = d; d = c; fd = fc; c = b - R * (b - a); fc = safeEval(fn, c); }
			else { a = c; c = d; fc = fd; d = a + R * (b - a); fd = safeEval(fn, d); }
		}
		return (a + b) / 2;
	}

	/** 扫描找局部极值点，返回 [{x, y, kind}] */
	function extrema(fn, a, b, samples) {
		const n = samples || 1600;
		const step = (b - a) / n;
		const out = [];
		let y0 = safeEval(fn, a);
		let y1 = safeEval(fn, a + step);

		for (let k = 2; k <= n; k++) {
			const x = a + step * k;
			const y2 = safeEval(fn, x);
			if (y0 !== null && y1 !== null && y2 !== null) {
				const isMax = y1 > y0 && y1 >= y2;
				const isMin = y1 < y0 && y1 <= y2;
				if (isMax || isMin) {
					const xr = golden(fn, x - step * 2, x, isMax);
					const yr = safeEval(fn, xr);
					if (yr !== null) out.push({ x: xr, y: yr, kind: isMax ? "max" : "min" });
				}
			}
			y0 = y1; y1 = y2;
		}
		return dedupePts(out, Math.abs(step) * 3);
	}

	/** 两函数交点 */
	function intersections(f1, f2, a, b, samples) {
		return roots(x => {
			const y1 = f1(x), y2 = f2(x);
			return y1 - y2;
		}, a, b, samples);
	}

	/** 数值导数 */
	function derivative(fn, x) {
		const h = Math.max(1e-7, Math.abs(x) * 1e-7);
		const y1 = safeEval(fn, x + h);
		const y2 = safeEval(fn, x - h);
		if (y1 === null || y2 === null) return null;
		return (y1 - y2) / (2 * h);
	}

	function dedupe(arr, tol) {
		const out = [];
		for (let i = 0; i < arr.length; i++) {
			let dup = false;
			for (let j = 0; j < out.length; j++) {
				if (Math.abs(arr[i] - out[j]) < tol) { dup = true; break; }
			}
			if (!dup) out.push(arr[i]);
		}
		return out;
	}

	function dedupePts(pts, tol) {
		const out = [];
		for (let i = 0; i < pts.length; i++) {
			let dup = false;
			for (let j = 0; j < out.length; j++) {
				if (Math.abs(pts[i].x - out[j].x) < tol) { dup = true; break; }
			}
			if (!dup) out.push(pts[i]);
		}
		return out;
	}

	return { roots, extrema, intersections, derivative, bisect };
})();

/* ============================================================
   6. 主题色板
   ============================================================ */
const PALETTE = {
	light: ["#2563eb", "#dc2626", "#059669", "#d97706", "#7c3aed", "#0891b2", "#db2777", "#65a30d"],
	dark: ["#60a5fa", "#f87171", "#34d399", "#fbbf24", "#a78bfa", "#22d3ee", "#f472b6", "#a3e635"]
};

function currentTheme() {
	return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
}

/** 主题按钮文案随当前主题与语言变化 */
function updateThemeLabel() {
	const el = document.getElementById("btnTheme");
	if (el) el.textContent = currentTheme() === "dark" ? t("themeLight") : t("themeDark");
}
function palette() {
	return PALETTE[currentTheme()];
}
function cssVar(name) {
	return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ============================================================
   7. 渲染器
   ============================================================ */
class Renderer {
	constructor(canvas, vp) {
		this.canvas = canvas;
		this.ctx = canvas.getContext("2d");
		this.vp = vp;
		this.dpr = 1;
		this.cssW = 0;
		this.cssH = 0;
		this.colors = null;
	}

	/**
	 * 一次性读出全部主题色并缓存。
	 * getComputedStyle 会触发样式重算，如果在每个标记上各调一次，
	 * 零点密集时单帧可累积数十次调用，是明显的性能陷阱。
	 */
	refreshColors() {
		const cs = getComputedStyle(document.documentElement);
		const g = n => cs.getPropertyValue(n).trim();
		this.colors = {
			bgCanvas: g("--canvas"),
			gridMinor: g("--grid-minor"),
			gridMajor: g("--grid-major"),
			axis: g("--axis"),
			textFaint: g("--faint"),
			textDim: g("--muted")
		};
		return this.colors;
	}

	themeColors() {
		return this.colors || this.refreshColors();
	}

	resize() {
		const rect = this.canvas.parentElement.getBoundingClientRect();
		const w = Math.max(1, Math.round(rect.width));
		const h = Math.max(1, Math.round(rect.height));
		const dpr = Math.min(window.devicePixelRatio || 1, 2);

		this.dpr = dpr;
		this.cssW = w;
		this.cssH = h;
		this.canvas.width = Math.round(w * dpr);
		this.canvas.height = Math.round(h * dpr);
		this.canvas.style.width = w + "px";
		this.canvas.style.height = h + "px";
		this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

		this.vp.W = w;
		this.vp.H = h;
	}

	/* ---------- 网格步长：1 / 2 / 5 × 10^n ---------- */
	niceStep(pxPerUnit, targetPx) {
		const raw = (targetPx || 78) / pxPerUnit;
		const mag = Math.pow(10, Math.floor(Math.log10(raw)));
		const norm = raw / mag;
		let mult;
		if (norm <= 1.2) mult = 1;
		else if (norm <= 2.4) mult = 2;
		else if (norm <= 6) mult = 5;
		else mult = 10;
		return mult * mag;
	}

	fmtTick(v, step) {
		if (Math.abs(v) < step * 1e-6) return "0";
		const av = Math.abs(v);
		if (av >= 1e6 || av < 1e-4) {
			return v.toExponential(1).replace("e+", "e");
		}
		let dec = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
		dec = Math.min(dec, 8);
		let s = v.toFixed(dec);
		if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
		return s;
	}

	drawGrid() {
		const ctx = this.ctx, vp = this.vp, W = vp.W, H = vp.H;
		if (W < 2 || H < 2) return;

		const C = this.themeColors();
		const cMinor = C.gridMinor;
		const cMajor = C.gridMajor;
		const cAxis = C.axis;
		const cText = C.textFaint;

		const stepX = this.niceStep(vp.kx, 84);
		const stepY = this.niceStep(vp.ky, 84);
		const minorX = stepX / (stepX / Math.pow(10, Math.floor(Math.log10(stepX))) === 5 ? 5 : 4);
		const minorY = stepY / (stepY / Math.pow(10, Math.floor(Math.log10(stepY))) === 5 ? 5 : 4);

		const x0 = vp.toWx(0), x1 = vp.toWx(W);
		const y1 = vp.toWy(0), y0 = vp.toWy(H);

		/* 次网格 */
		ctx.lineWidth = 1;
		ctx.strokeStyle = cMinor;
		ctx.beginPath();
		const startMX = Math.ceil(x0 / minorX) * minorX;
		for (let x = startMX; x <= x1; x += minorX) {
			const sx = Math.round(vp.toSx(x)) + 0.5;
			ctx.moveTo(sx, 0); ctx.lineTo(sx, H);
		}
		const startMY = Math.ceil(y0 / minorY) * minorY;
		for (let y = startMY; y <= y1; y += minorY) {
			const sy = Math.round(vp.toSy(y)) + 0.5;
			ctx.moveTo(0, sy); ctx.lineTo(W, sy);
		}
		ctx.stroke();

		/* 主网格 */
		ctx.strokeStyle = cMajor;
		ctx.beginPath();
		const startX = Math.ceil(x0 / stepX) * stepX;
		for (let x = startX; x <= x1; x += stepX) {
			const sx = Math.round(vp.toSx(x)) + 0.5;
			ctx.moveTo(sx, 0); ctx.lineTo(sx, H);
		}
		const startY = Math.ceil(y0 / stepY) * stepY;
		for (let y = startY; y <= y1; y += stepY) {
			const sy = Math.round(vp.toSy(y)) + 0.5;
			ctx.moveTo(0, sy); ctx.lineTo(W, sy);
		}
		ctx.stroke();

		/* 坐标轴 */
		const ax = vp.toSx(0), ay = vp.toSy(0);
		const showYAxis = ax > -1 && ax < W + 1;
		const showXAxis = ay > -1 && ay < H + 1;

		ctx.strokeStyle = cAxis;
		ctx.lineWidth = 1.4;
		ctx.beginPath();
		if (showXAxis) {
			const py = Math.round(ay) + 0.5;
			ctx.moveTo(0, py); ctx.lineTo(W, py);
		}
		if (showYAxis) {
			const px = Math.round(ax) + 0.5;
			ctx.moveTo(px, 0); ctx.lineTo(px, H);
		}
		ctx.stroke();

		/* 刻度标签 */
		ctx.font = "11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
		ctx.fillStyle = cText;
		ctx.lineWidth = 1;

		const labelBaseY = showXAxis ? ay : (y0 <= 0 ? H - 6 : 14);
		const labelBaseX = showYAxis ? ax : (x0 >= 0 ? 8 : W - 8);

		ctx.textAlign = "center";
		ctx.textBaseline = "top";
		for (let x = startX; x <= x1; x += stepX) {
			if (Math.abs(x) < stepX * 1e-6) continue;
			const sx = vp.toSx(x);
			if (sx < 26 || sx > W - 26) continue;
			const ty = clamp(labelBaseY + 5, 2, H - 16);
			ctx.fillText(this.fmtTick(x, stepX), sx, ty);
		}

		ctx.textAlign = "right";
		ctx.textBaseline = "middle";
		for (let y = startY; y <= y1; y += stepY) {
			if (Math.abs(y) < stepY * 1e-6) continue;
			const sy = vp.toSy(y);
			if (sy < 12 || sy > H - 12) continue;
			const tx = clamp(labelBaseX - 6, 28, W - 6);
			ctx.fillText(this.fmtTick(y, stepY), tx, sy);
		}

		/* 原点 */
		if (showXAxis && showYAxis) {
			ctx.textAlign = "right";
			ctx.textBaseline = "top";
			ctx.fillText("0", ax - 5, ay + 5);
		}

		/* 轴向字母 */
		ctx.fillStyle = C.textDim;
		ctx.font = "italic 12px Georgia, serif";
		if (showXAxis) {
			ctx.textAlign = "right"; ctx.textBaseline = "bottom";
			ctx.fillText("x", W - 8, ay - 6);
		}
		if (showYAxis) {
			ctx.textAlign = "left"; ctx.textBaseline = "top";
			ctx.fillText("y", ax + 7, 8);
		}
	}

	strokeSegs(segs, color, width, dash, alpha) {
		const ctx = this.ctx;
		ctx.save();
		ctx.strokeStyle = color;
		ctx.lineWidth = width;
		ctx.lineJoin = "round";
		ctx.lineCap = "round";
		if (alpha !== undefined) ctx.globalAlpha = alpha;
		if (dash) ctx.setLineDash(dash);
		for (let s = 0; s < segs.length; s++) {
			const seg = segs[s];
			if (seg.length < 2) continue;
			ctx.beginPath();
			ctx.moveTo(seg[0][0], seg[0][1]);
			for (let k = 1; k < seg.length; k++) ctx.lineTo(seg[k][0], seg[k][1]);
			ctx.stroke();
		}
		ctx.restore();
	}

	dot(sx, sy, radius, color, hollow) {
		const ctx = this.ctx;
		const bg = this.themeColors().bgCanvas;
		ctx.beginPath();
		ctx.arc(sx, sy, radius, 0, Math.PI * 2);
		if (hollow) {
			ctx.fillStyle = bg;
			ctx.fill();
			ctx.strokeStyle = color;
			ctx.lineWidth = 1.6;
			ctx.stroke();
		} else {
			ctx.fillStyle = color;
			ctx.fill();
			ctx.strokeStyle = bg;
			ctx.lineWidth = 1.4;
			ctx.stroke();
		}
	}

	square(sx, sy, size, color) {
		const ctx = this.ctx;
		ctx.beginPath();
		ctx.rect(sx - size / 2, sy - size / 2, size, size);
		ctx.fillStyle = color;
		ctx.fill();
		ctx.strokeStyle = this.themeColors().bgCanvas;
		ctx.lineWidth = 1.2;
		ctx.stroke();
	}

	label(sx, sy, text, color) {
		const ctx = this.ctx;
		ctx.save();
		ctx.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
		const pad = 3;
		const w = ctx.measureText(text).width;
		const bg = this.themeColors().bgCanvas;
		ctx.globalAlpha = 0.82;
		ctx.fillStyle = bg;
		ctx.fillRect(sx + 5 - pad, sy - 15, w + pad * 2, 14);
		ctx.globalAlpha = 1;
		ctx.fillStyle = color;
		ctx.textAlign = "left";
		ctx.textBaseline = "middle";
		ctx.fillText(text, sx + 5, sy - 8);
		ctx.restore();
	}

	/* 切线：过 (x0, f(x0))，斜率 m，在视口内截取合适长度。
	   slot 用于把多条曲线的标注错开，避免叠在同一个点上。 */
	tangentLine(fn, x0, color, slot) {
		const y0 = safeEval(fn, x0);
		const m = Numeric.derivative(fn, x0);
		if (y0 === null || m === null) return;
		const vp = this.vp;
		const span = (vp.toWx(vp.W) - vp.toWx(0)) * 0.2;
		const xa = x0 - span, xb = x0 + span;
		const ya = y0 + m * (xa - x0);
		const yb = y0 + m * (xb - x0);
		this.strokeSegs([[[vp.toSx(xa), vp.toSy(ya)], [vp.toSx(xb), vp.toSy(yb)]]], color, 1.4, [5, 4], 0.85);
		this.dot(vp.toSx(x0), vp.toSy(y0), 4, color, false);
		const off = (slot || 0) * 15;
		this.label(vp.toSx(x0), vp.toSy(y0) - 4 - off,
			"k=" + fmtNum(m, 3) + "  (" + fmtNum(x0, 2) + ", " + fmtNum(y0, 2) + ")", color);
	}
}

function fmtNum(v, sig) {
	if (!Number.isFinite(v)) return "—";
	/* 二分求根本质上收敛到 1e-16 量级，直接显示会得到 2.2e-16 这种噪声 */
	if (Math.abs(v) < 5e-10) return "0";
	const a = Math.abs(v);
	if (a !== 0 && (a >= 1e5 || a < 1e-3)) return v.toExponential(1).replace("e+", "e");
	let s = v.toFixed(sig);
	if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
	return s;
}

/* ============================================================
   8. 应用状态
   ============================================================ */
const App = {
	vp: new Viewport(),
	renderer: null,
	curves: [],          /* {id, expr, fn, color, visible, error} */
	seq: 0,
	nextColor: 0,
	analysis: { roots: false, extrema: false, cross: false, deriv: false, tan: "" },
	hover: null,
	raf: 0,
	readout: null,
	interacting: false,
	interactTimer: 0
};

const $ = id => document.getElementById(id);

/* ---------- 曲线管理 ---------- */

function pickColor() {
	const p = palette();
	return p[App.nextColor++ % p.length];
}

function addCurve(expr, visible) {
	if (App.curves.length >= 8) return null;
	const c = {
		id: ++App.seq,
		expr: expr || "",
		fn: null,
		color: pickColor(),
		visible: visible !== false,
		error: ""
	};
	recompile(c);
	App.curves.push(c);
	renderCurveList();
	scheduleDraw();
	return c;
}

function removeCurve(id) {
	App.curves = App.curves.filter(c => c.id !== id);
	renderCurveList();
	scheduleDraw();
}

function recompile(c) {
	const text = (c.expr || "").trim();
	if (!text) { c.fn = null; c.error = ""; return; }
	try {
		c.fn = Expr.parseToFn(text);
		c.error = "";
	} catch (e) {
		c.fn = null;
		/* 引擎抛的是错误码，这里按当前语言翻译 */
		c.error = e && e.code ? t(e.code, e.params) : (e && e.message ? e.message : String(e));
	}
}

function renderCurveList() {
	const box = $("curveList");
	box.textContent = "";

	App.curves.forEach(c => {
		const row = document.createElement("div");
		row.className = "curve" + (c.error ? " bad" : "") + (c.visible ? "" : " off");
		row.dataset.id = String(c.id);

		const sw = document.createElement("span");
		sw.className = "swatch";
		sw.style.background = c.color;
		sw.style.color = c.color;
		sw.title = t("toggleCurve");
		sw.style.cursor = "pointer";
		sw.addEventListener("click", () => {
			c.visible = !c.visible;
			renderCurveList();
			scheduleDraw();
		});

		const wrap = document.createElement("div");
		wrap.className = "wrap";

		const input = document.createElement("input");
		input.type = "text";
		input.value = c.expr;
		input.spellcheck = false;
		input.autocapitalize = "off";
		input.autocomplete = "off";
		input.placeholder = t("curvePlaceholder");
		input.addEventListener("input", () => {
			c.expr = input.value;
			recompile(c);
			row.classList.toggle("bad", !!c.error);
			updateErr(row, c);
			renderLegend();   /* 表达式变了，图例里的文字跟着变 */
			scheduleDraw();
		});
		input.addEventListener("keydown", ev => {
			if (ev.key === "Enter") { ev.preventDefault(); input.blur(); }
		});
		wrap.appendChild(input);

		const del = document.createElement("button");
		del.className = "iconbtn del";
		del.textContent = "✕";
		del.title = t("deleteCurve");
		del.disabled = App.curves.length <= 1;
		del.addEventListener("click", () => removeCurve(c.id));

		row.appendChild(sw);
		row.appendChild(wrap);
		row.appendChild(del);
		box.appendChild(row);

		updateErr(row, c);
	});

	$("btnAdd").disabled = App.curves.length >= 8;
	renderLegend();
}

function updateErr(row, c) {
	const old = row.nextElementSibling;
	if (old && old.classList && old.classList.contains("curve-err")) old.remove();
	if (!c.error) return;
	const div = document.createElement("div");
	div.className = "curve-err";
	div.textContent = c.error;
	row.after(div);
}

function renderLegend() {
	const box = $("legend");
	box.textContent = "";
	const shown = App.curves.filter(c => c.visible && c.fn);
	if (shown.length <= 1) { box.classList.add("hide"); return; }
	box.classList.remove("hide");

	shown.forEach((c, idx) => {
		const li = document.createElement("div");
		li.className = "li";
		const bar = document.createElement("span");
		bar.className = "bar";
		bar.style.background = c.color;
		const nm = document.createElement("span");
		nm.className = "nm";
		nm.textContent = "y = " + c.expr;
		li.appendChild(bar);
		li.appendChild(nm);
		box.appendChild(li);
		void idx;
	});
}

/* ---------- 绘制主循环 ---------- */

function scheduleDraw() {
	if (App.raf) return;
	App.raf = requestAnimationFrame(() => {
		App.raf = 0;
		draw();
	});
}

/** 标记进入交互状态；停止 160ms 后恢复完整渲染 */
function beginInteract() {
	App.interacting = true;
	clearTimeout(App.interactTimer);
	App.interactTimer = setTimeout(() => {
		App.interacting = false;
		scheduleDraw();
	}, 160);
}

function draw() {
	const r = App.renderer;
	if (!r) return;
	const vp = App.vp;

	r.refreshColors();
	r.ctx.clearRect(0, 0, vp.W, vp.H);
	r.drawGrid();

	const a = App.analysis;
	const x0 = vp.toWx(0), x1 = vp.toWx(vp.W);
	const active = App.curves.filter(c => c.visible && c.fn);

	/* 拖拽 / 缩放期间跳过数值分析：求根与求极值需要数千次求值，
	   每帧全算会让平移明显掉帧。松手 160ms 后补算。 */
	const skipAnalysis = !!App.interacting;

	/* 导函数曲线（先画，压在主线下面；降透明度以示区别） */
	if (a.deriv) {
		active.forEach(c => {
			const df = x => {
				const d = Numeric.derivative(c.fn, x);
				return d === null ? NaN : d;
			};
			const segs = samplePath(df, vp);
			r.strokeSegs(segs, c.color, 1.4, [6, 5], 0.5);
		});
	}

	/* 主曲线 */
	active.forEach(c => {
		const segs = samplePath(c.fn, vp);
		r.strokeSegs(segs, c.color, 2.1);
	});

	/* 分析标记 */
	let notes = [];

	if (!skipAnalysis && (a.roots || a.extrema || a.cross)) {
		active.forEach(c => {
			if (a.roots) {
				const rs = Numeric.roots(c.fn, x0, x1, 2200);
				rs.forEach(x => {
					const y = safeEval(c.fn, x);
					if (y === null) return;
					r.dot(vp.toSx(x), vp.toSy(y), 4.2, c.color, true);
					notes.push({ kKey: "roRoot", x, y, color: c.color, expr: c.expr });
				});
			}
			if (a.extrema) {
				const es = Numeric.extrema(c.fn, x0, x1, 2200);
				es.forEach(p => {
					r.dot(vp.toSx(p.x), vp.toSy(p.y), 4.6, c.color, false);
					notes.push({ kKey: p.kind === "max" ? "roMax" : "roMin", x: p.x, y: p.y, color: c.color, expr: c.expr });
				});
			}
		});

		if (a.cross && active.length >= 2) {
			for (let i = 0; i < active.length; i++) {
				for (let j = i + 1; j < active.length; j++) {
					const xs = Numeric.intersections(active[i].fn, active[j].fn, x0, x1, 2200);
					xs.forEach(x => {
						const y = safeEval(active[i].fn, x);
						if (y === null) return;
						r.square(vp.toSx(x), vp.toSy(y), 7, active[i].color);
						notes.push({
							kKey: "roCross", x, y, color: active[i].color,
							expr: active[i].expr + " ∩ " + active[j].expr
						});
					});
				}
			}
		}
	}

	/* 切线 */
	const tanText = (a.tan || "").trim();
	if (tanText) {
		let tx = null;
		try {
			const tf = Expr.parseToFn(tanText);
			tx = safeEval(tf, 0);
		} catch (e) {
			tx = null;
		}
		if (tx === null) {
			const n = Number(tanText);
			tx = Number.isFinite(n) ? n : null;
		}
		if (tx !== null) {
			active.forEach((c, i) => r.tangentLine(c.fn, tx, c.color, i));
		}
	}

	/* 悬停竖线 + 读数 */
	if (App.hover) {
		const hx = App.hover.wx;
		const sx = vp.toSx(hx);
		const ctx = r.ctx;
		ctx.save();
		ctx.strokeStyle = r.themeColors().textFaint;
		ctx.globalAlpha = 0.5;
		ctx.lineWidth = 1;
		ctx.setLineDash([3, 4]);
		ctx.beginPath();
		ctx.moveTo(Math.round(sx) + 0.5, 0);
		ctx.lineTo(Math.round(sx) + 0.5, vp.H);
		ctx.stroke();
		ctx.restore();

		active.forEach(c => {
			const y = safeEval(c.fn, hx);
			if (y === null) return;
			const sy = vp.toSy(y);
			if (sy < -40 || sy > vp.H + 40) return;
			r.dot(sx, sy, 3.2, c.color, false);
		});
	}

	/* 读数与标记同步：交互中不更新，避免抖动；无任何分析开启时清空 */
	if (!skipAnalysis) {
		App.readout = notes;
		renderReadout(notes);
	}

	/* 空状态：仅在曲线数量变化时才碰 DOM，避免每帧切换 class */
	if (App._activeCount !== active.length) {
		App._activeCount = active.length;
		const em = $("empty");
		if (em) em.classList.toggle("show", active.length === 0);
	}
}

/* 公开 API：三个纯逻辑模块不含任何 DOM 依赖，可单独取用，
   也便于在浏览器控制台直接调用（见 README「Extending」一节）。 */
window.FunctionPlot = { Expr, Viewport, Numeric };

/* 调试钩子：离屏冒烟测试与浏览器控制台手动重绘用。
   不参与正常流程，纯粹是给「确认到底画没画」留一个入口。 */
window.__fpDraw = draw;

function renderReadout(notes) {
	const box = $("readout");
	if (!notes || notes.length === 0) {
		box.classList.remove("show");
		box.textContent = "";
		return;
	}
	box.classList.add("show");
	box.textContent = "";

	const max = 40;
	notes.slice(0, max).forEach(n => {
		const line = document.createElement("div");
		const k = document.createElement("span");
		k.className = "k";
		k.textContent = t(n.kKey) + " ";
		const v = document.createElement("b");
		v.textContent = "(" + fmtNum(n.x, 4) + ", " + fmtNum(n.y, 4) + ")";
		line.appendChild(k);
		line.appendChild(v);
		box.appendChild(line);
	});
	if (notes.length > max) {
		const more = document.createElement("div");
		more.className = "k";
		more.textContent = t("roMore", { n: notes.length - max });
		box.appendChild(more);
	}
}

/* ---------- 视图操作 ---------- */

function autoFit() {
	const active = App.curves.filter(c => c.visible && c.fn);
	const vp = App.vp;

	if (active.length === 0) {
		vp.cx = 0; vp.cy = 0; vp.kx = 60; vp.ky = 60;
		scheduleDraw();
		return;
	}

	/* x 范围：以当前视野为基准，默认 ±10 */
	const xa = -10, xb = 10;
	let lo = Infinity, hi = -Infinity;

	const N = 600;
	for (let k = 0; k <= N; k++) {
		const x = xa + (xb - xa) * k / N;
		active.forEach(c => {
			const y = safeEval(c.fn, x);
			if (y === null) return;
			if (Math.abs(y) > 1e5) return;
			if (y < lo) lo = y;
			if (y > hi) hi = y;
		});
	}

	if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi - lo < 1e-9) {
		lo = -10; hi = 10;
	}

	const padY = (hi - lo) * 0.14 || 1;
	lo -= padY; hi += padY;

	const wSpan = xb - xa, hSpan = hi - lo;
	const cx = (xa + xb) / 2, cy = (lo + hi) / 2;

	/* 等比缩放，取能同时容纳两向的比例 */
	const kx = (vp.W * 0.9) / wSpan;
	const ky = (vp.H * 0.9) / hSpan;
	const k = Math.min(kx, ky);

	vp.cx = cx;
	vp.cy = cy;
	vp.kx = clamp(k, 1e-4, 1e7);
	vp.ky = vp.kx;
	scheduleDraw();
}

function resetView() {
	App.vp.cx = 0;
	App.vp.cy = 0;
	App.vp.kx = 60;
	App.vp.ky = 60;
	scheduleDraw();
}

/* ---------- 交互 ---------- */

function bindCanvas() {
	const canvas = $("board");
	const vp = App.vp;

	let dragging = false;
	let lastX = 0, lastY = 0;
	let moved = false;
	let pinchDist = 0;

	const pos = ev => {
		const rect = canvas.getBoundingClientRect();
		return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
	};

	canvas.addEventListener("pointerdown", ev => {
		if (ev.button !== 0 && ev.pointerType === "mouse") return;
		canvas.setPointerCapture(ev.pointerId);
		dragging = true;
		moved = false;
		const p = pos(ev);
		lastX = p.x; lastY = p.y;
		canvas.classList.add("panning");
		$("hud").classList.remove("show");
	});

	canvas.addEventListener("pointermove", ev => {
		const p = pos(ev);

		if (dragging) {
			const dx = p.x - lastX, dy = p.y - lastY;
			if (Math.abs(dx) + Math.abs(dy) > 0) moved = true;
			lastX = p.x; lastY = p.y;
			vp.panBy(dx, dy);
			App.hover = null;
			beginInteract();
			scheduleDraw();
			return;
		}

		if (ev.pointerType === "mouse") {
			App.hover = { wx: vp.toWx(p.x) };
			updateHud(p);
			scheduleDraw();
		}
	});

	const endDrag = ev => {
		if (!dragging) return;
		dragging = false;
		canvas.classList.remove("panning");
		try { canvas.releasePointerCapture(ev.pointerId); } catch (e) { void e; }
		void moved;
	};

	canvas.addEventListener("pointerup", endDrag);
	canvas.addEventListener("pointercancel", endDrag);
	canvas.addEventListener("pointerleave", () => {
		App.hover = null;
		$("hud").classList.remove("show");
		scheduleDraw();
	});

	/* 滚轮缩放 */
	canvas.addEventListener("wheel", ev => {
		ev.preventDefault();
		const p = pos(ev);
		const unit = ev.deltaMode === 1 ? 16 : (ev.deltaMode === 2 ? vp.H : 1);
		const dy = ev.deltaY * unit;
		const factor = Math.exp(-dy * 0.0016);
		vp.zoomAt(p.x, p.y, clamp(factor, 0.2, 5));
		App.hover = { wx: vp.toWx(p.x) };
		updateHud(p);
		beginInteract();
		scheduleDraw();
	}, { passive: false });

	/* 双指捏合 */
	canvas.addEventListener("touchmove", ev => {
		if (ev.touches.length !== 2) return;
		ev.preventDefault();
		const r = canvas.getBoundingClientRect();
		const t0 = ev.touches[0], t1 = ev.touches[1];
		const d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
		const mx = (t0.clientX + t1.clientX) / 2 - r.left;
		const my = (t0.clientY + t1.clientY) / 2 - r.top;
		if (pinchDist > 0) {
			vp.zoomAt(mx, my, clamp(d / pinchDist, 0.5, 2));
			beginInteract();
			scheduleDraw();
		}
		pinchDist = d;
		dragging = false;
	}, { passive: false });

	canvas.addEventListener("touchend", () => { pinchDist = 0; });
}

function updateHud(p) {
	const vp = App.vp;
	const wx = vp.toWx(p.x);
	const hud = $("hud");
	const active = App.curves.filter(c => c.visible && c.fn);

	let text = "x = " + fmtNum(wx, 4);
	const first = active[0];
	if (first) {
		const y = safeEval(first.fn, wx);
		text += "   y = " + (y === null ? "—" : fmtNum(y, 4));
	}
	hud.textContent = text;
	hud.classList.add("show");
}

/* ---------- 主题 ---------- */

function applyTheme(theme) {
	document.documentElement.dataset.theme = theme;
	updateThemeLabel();
	Store.set("fp.theme", theme);
	/* 曲线颜色跟随主题 */
	const p = palette();
	App.curves.forEach((c, i) => { c.color = p[i % p.length]; });
	renderCurveList();
	scheduleDraw();
}

function initTheme() {
	let saved = Store.get("fp.theme");
	if (saved !== "dark" && saved !== "light") {
		saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
	}
	document.documentElement.dataset.theme = saved;
}

/* ---------- 导出 ---------- */

function exportPng() {
	const src = $("board");
	const scale = 2;
	const out = document.createElement("canvas");
	out.width = src.width * scale;
	out.height = src.height * scale;
	const ctx = out.getContext("2d");

	ctx.fillStyle = cssVar("--canvas");
	ctx.fillRect(0, 0, out.width, out.height);
	ctx.imageSmoothingEnabled = true;
	ctx.drawImage(src, 0, 0, out.width, out.height);

	const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
	out.toBlob(blob => {
		if (!blob) return;
		const url = URL.createObjectURL(blob);
		const a = document.createElement("a");
		a.href = url;
		a.download = "function-plot-" + stamp + ".png";
		document.body.appendChild(a);
		a.click();
		a.remove();
		setTimeout(() => URL.revokeObjectURL(url), 2000);
	}, "image/png");
}

/* ---------- 启动 ---------- */
/** 设置分析开关的选中态。除 checked 外还要同步 .on 类，
    原因见 CSS 里 ".check input:checked, .check input.on" 处的注释。 */
function setSwitch(id, on) {
	const el = $(id);
	if (!el) return;
	el.checked = on;
	el.classList.toggle("on", on);
}

function bindUi() {
	$("btnAdd").addEventListener("click", () => {
		const c = addCurve("", true);
		if (!c) return;
		const rows = $("curveList").querySelectorAll(".curve input");
		const last = rows[rows.length - 1];
		if (last) { last.focus(); last.select(); }
	});

	$("btnFit").addEventListener("click", autoFit);
	$("btnReset").addEventListener("click", resetView);
	$("btnPng").addEventListener("click", exportPng);
	$("btnTheme").addEventListener("click", () => {
		applyTheme(currentTheme() === "dark" ? "light" : "dark");
	});

	/* 语言切换 */
	const langBtn = $("btnLang");
	const langMenu = $("langMenu");
	langBtn.addEventListener("click", ev => {
		ev.stopPropagation();
		langMenu.classList.toggle("open");
	});
	langMenu.querySelectorAll("button").forEach(b => {
		b.addEventListener("click", ev => {
			ev.stopPropagation();
			applyLang(b.getAttribute("data-lang"), true);
			langMenu.classList.remove("open");
		});
	});
	document.addEventListener("click", () => langMenu.classList.remove("open"));
	window.addEventListener("keydown", ev => {
		if (ev.key === "Escape") langMenu.classList.remove("open");
	});

	$("btnIn").addEventListener("click", () => {
		App.vp.zoomAt(App.vp.W / 2, App.vp.H / 2, 1.25);
		scheduleDraw();
	});
	$("btnOut").addEventListener("click", () => {
		App.vp.zoomAt(App.vp.W / 2, App.vp.H / 2, 0.8);
		scheduleDraw();
	});

	/* 分析开关 */
	const map = { anRoots: "roots", anExtrema: "extrema", anCross: "cross", anDeriv: "deriv" };
	Object.keys(map).forEach(id => {
		const el = $(id);
		el.addEventListener("change", () => {
			App.analysis[map[id]] = el.checked;
			el.classList.toggle("on", el.checked);
			scheduleDraw();
		});
	});

	const tan = $("anTan");
	let tanTimer = 0;
	tan.addEventListener("input", () => {
		clearTimeout(tanTimer);
		tanTimer = setTimeout(() => {
			App.analysis.tan = tan.value;
			scheduleDraw();
		}, 260);
	});

	/* 快捷键 */
	window.addEventListener("keydown", ev => {
		const tag = (ev.target && ev.target.tagName) || "";
		if (tag === "INPUT" || tag === "TEXTAREA") return;
		if (ev.key === "f" || ev.key === "F") { autoFit(); }
		else if (ev.key === "r" || ev.key === "R") { resetView(); }
		else if (ev.key === "+" || ev.key === "=") { App.vp.zoomAt(App.vp.W / 2, App.vp.H / 2, 1.25); scheduleDraw(); }
		else if (ev.key === "-" || ev.key === "_") { App.vp.zoomAt(App.vp.W / 2, App.vp.H / 2, 0.8); scheduleDraw(); }
	});
}

function boot() {
	const canvas = $("board");
	const vp = App.vp;
	const renderer = new Renderer(canvas, vp);
	App.renderer = renderer;

	renderer.resize();
	bindCanvas();
	bindUi();

	/* 默认示例：一条能同时展示零点、极值、导数的三次曲线 */
	addCurve("x^3/3 - x", true);
	setSwitch("anRoots", true);
	setSwitch("anExtrema", true);
	App.analysis.roots = true;
	App.analysis.extrema = true;

	resetView();

	/* 尺寸变化 */
	let ro = null;
	if (typeof ResizeObserver !== "undefined") {
		ro = new ResizeObserver(() => {
			renderer.resize();
			scheduleDraw();
		});
		ro.observe($("stage"));
	} else {
		window.addEventListener("resize", () => {
			renderer.resize();
			scheduleDraw();
		});
	}

	/* 主题跟随系统（用户未手动选择时） */
	if (window.matchMedia) {
		const mq = window.matchMedia("(prefers-color-scheme: dark)");
		const onChange = () => {
			let saved = null;
			try { saved = localStorage.getItem("fp.theme"); } catch (e) { void e; }
			if (saved === "dark" || saved === "light") return;
			document.documentElement.dataset.theme = mq.matches ? "dark" : "light";
			updateThemeLabel();
			const p = palette();
			App.curves.forEach((c, i) => { c.color = p[i % p.length]; });
			renderCurveList();
			scheduleDraw();
		};
		if (mq.addEventListener) mq.addEventListener("change", onChange);
		else if (mq.addListener) mq.addListener(onChange);
	}

	/* 文案填充放在最后：此时曲线列表、读数区等动态区域均已建立 */
	scheduleDraw();
	applyLang(LANG, false);
}

/* ---------- 全局错误可见化：宁可显示错误，也不要白屏 ---------- */
(function guard() {
	const report = msg => {
		let bar = document.getElementById("fpFatal");
		if (!bar) {
			bar = document.createElement("div");
			bar.id = "fpFatal";
			bar.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;padding:10px 14px;"
				+ "background:#b91c1c;color:#fff;font:12px/1.5 ui-monospace,Menlo,monospace;"
				+ "white-space:pre-wrap;max-height:45vh;overflow:auto";
			document.body.appendChild(bar);
		}
		bar.textContent = t("fatalPrefix") + "\n" + msg;
	};
	window.addEventListener("error", ev => {
		report((ev.message || "未知错误") + "\n" + (ev.filename || "") + ":" + (ev.lineno || 0));
	});
	window.addEventListener("unhandledrejection", ev => {
		const r = ev.reason;
		report(r && r.stack ? r.stack : String(r));
	});
	window.__fpReport = report;
})();

function safeBoot() {
	try {
		initTheme();
		LANG = detectLang();
		boot();
	} catch (e) {
		if (window.__fpReport) window.__fpReport(e && e.stack ? e.stack : String(e));
		else console.error(e);
	}
}

if (document.readyState === "loading") {
	document.addEventListener("DOMContentLoaded", safeBoot);
} else {
	safeBoot();
}
</script>
